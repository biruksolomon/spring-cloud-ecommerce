spring:
  application:
    name: api-gateway

  # Disables the Spring Cloud Config client outright for tests (belt and
  # braces alongside "optional:" on the main config's import - this is the
  # property ConfigServerConfigDataLoader actually checks, so it skips
  # config-server cleanly instead of a network call that would only ever
  # fail in CI anyway).
  cloud:
    config:
      enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# Same dev-only key pair used across the other services' test config -
# JwtProvider requires rsa.public-key with no default, so it must be set
# here even though this service never signs, only verifies.
rsa:
  public-key: 

app:
  internal-service-token: test-only-7f3c9a2e81b64d0fa5c7e93b18d246a9