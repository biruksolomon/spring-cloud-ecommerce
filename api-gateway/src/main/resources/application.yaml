spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/orders/**

            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/products/**

            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/auth/**

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/notifications/**

            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/payments/**

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: GET,POST,PUT,DELETE,OPTIONS
            allowedHeaders: "*"
            allowCredentials: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:mySecretKeyForJWTTokenGenerationAndValidationPurposesOnlyForDevelopmentAndTestingEnvironment}