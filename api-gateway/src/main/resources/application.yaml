spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/orders/**

            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/products/**

            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/auth/**

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/notifications/**

            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/payments/**

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: GET,POST,PUT,DELETE,OPTIONS
            allowedHeaders: "*"
            allowCredentials: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}

server:
  port: 8080

# Public half of auth-service's RS256 key pair - enough to verify a
# token's signature, not to mint one. Must match auth-service's
# rsa.public-key exactly; never set RSA_PRIVATE_KEY here.
rsa:
  public-key: ${RSA_PUBLIC_KEY:}

# Stamped onto every request the gateway forwards downstream (alongside
# X-User-Id/X-User-Email/X-User-Role) so each service can tell a
# gateway-forwarded request from a direct call with forged identity
# headers. Must match every downstream service's app.internal-service-token.
app:
  internal-service-token: ${INTERNAL_SERVICE_TOKEN:test-only-7f3c9a2e81b64d0fa5c7e93b18d246a9}