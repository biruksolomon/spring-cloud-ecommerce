spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/orders/**

            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/products/**

            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/auth/**

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/notifications/**

            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/payments/**

            - id: delivery-service
              uri: lb://delivery-service
              predicates:
                - Path=/deliveries/**

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: GET,POST,PUT,DELETE,OPTIONS
            allowedHeaders: "*"
            allowCredentials: false

server:
  port: 8080

# Public half of auth-service's RS256 key pair - enough to verify a
# token's signature, not to mint one. Must match auth-service's
# rsa.public-key exactly; never set RSA_PRIVATE_KEY here.
rsa:
  public-key: ${RSA_PUBLIC_KEY:}