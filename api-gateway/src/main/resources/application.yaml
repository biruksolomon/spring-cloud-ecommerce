spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
          - id: order-service
            uri: lb://order-service
            predicates:
              - Path=/orders/**
            filters:
              - RewritePath=/orders/(?<segment>/?.*), /$\{segment}

          - id: product-service
            uri: lb://product-service
            predicates:
              - Path=/products/**
            filters:
              - RewritePath=/products/(?<segment>/?.*), /$\{segment}

          - id: auth-service
            uri: lb://auth-service
            predicates:
              - Path=/auth/**
            filters:
              - RewritePath=/auth/(?<segment>/?.*), /$\{segment}

          - id: notification-service
            uri: lb://notification-service
            predicates:
              - Path=/notifications/**
            filters:
              - RewritePath=/notifications/(?<segment>/?.*), /$\{segment}

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: GET,POST,PUT,DELETE,OPTIONS
            allowedHeaders: "*"
            allowCredentials: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

server:
  port: 8080

jwt:
  secret: mySecretKeyForJWTTokenGenerationAndValidationPurposesOnlyForDevelopmentAndTestingEnvironment
