spring:
  application:
    name: auth-service

  cloud:
    config:
      enabled: false

  datasource:
    url: jdbc:h2:mem:authdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# rsa.private-key/rsa.public-key have no default (RsaKeyConfig) and only
# live in config-repo now - a real, working dev-only 2048-bit pair, same
# one config-repo/auth-service.yml defaults to. Not a secret worth
# protecting: fine to keep in-repo for tests, never use it outside local
# dev/test.
rsa:
  private-key: 
  public-key: 

app:
  internal-service-token: test-only-7f3c9a2e81b64d0fa5c7e93b18d246a9

# AdminSeeder all have defaults except admin.seed.password (defaults to
# empty string, not absent) - seeding still runs in tests unless disabled.
# Off in tests: no need for a seeded admin account to exist for context
# load or the rest of the suite, and it keeps test runs from depending on
# password-hashing timing.
admin:
  seed:
    enabled: false