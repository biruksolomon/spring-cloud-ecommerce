spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}

server:
  port: 8084

# RS256 key pair for signing/verifying access tokens. auth-service is the
# only service that ever loads the private key - api-gateway is configured
# with rsa.public-key only (see api-gateway's application.yaml), so it can
# verify tokens but never mint them.
#
# The defaults below are a REAL, working dev-only 2048-bit key pair,
# generated for this project and safe only for local development - anyone
# with this repo can forge tokens against it. Set RSA_PRIVATE_KEY and
# RSA_PUBLIC_KEY (base64-encoded DER: PKCS8 for the private key, X509 for
# the public key) to real, secret values in any shared or production
# environment, the same way JWT_SECRET used to need overriding.
rsa:
  private-key: ${RSA_PRIVATE_KEY:}
  public-key: ${RSA_PUBLIC_KEY:}

jwt:
  # Access tokens are short-lived on purpose - they can't be individually
  # revoked, so keeping the window small limits how long a stolen token
  # stays useful. Clients are expected to call /auth/refresh well before
  # this expires.
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}      # 15 min
  # Refresh tokens are long-lived but revocable and rotate on every use
  # (see RefreshTokenService) - this is the pair's actual session lifetime.
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days

# Shared secret that proves a request carrying X-User-* identity headers
# actually came from api-gateway, not from a caller hitting this service
# directly. Every downstream service (and this one, for /auth/user/{id}
# and /auth/logout-all) checks it in their UserContextFilter. Must match
# api-gateway's app.internal-service-token exactly.
app:
  internal-service-token: ${INTERNAL_SERVICE_TOKEN:test-only-7f3c9a2e81b64d0fa5c7e93b18d246a9}

# Seeds one ADMIN account on startup (see AdminSeeder). No password
# default on purpose - leave ADMIN_SEED_PASSWORD unset to skip seeding
# entirely, e.g. in an environment where admins are managed another way.
admin:
  seed:
    enabled: ${ADMIN_SEED_ENABLED:true}
    email: ${ADMIN_SEED_EMAIL:admin@example.com}
    password: ${ADMIN_SEED_PASSWORD:testpassword}
    first-name: ${ADMIN_SEED_FIRST_NAME:System}
    last-name: ${ADMIN_SEED_LAST_NAME:Admin}