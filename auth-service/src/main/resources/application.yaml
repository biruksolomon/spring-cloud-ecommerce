spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}

server:
  port: 8084

jwt:
  secret: ${JWT_SECRET:mySecretKeyForJWTTokenGenerationAndValidationPurposesOnlyForDevelopmentAndTestingEnvironment}
  expiration: 3600000

# Seeds one ADMIN account on startup (see AdminSeeder). No password
# default on purpose - leave ADMIN_SEED_PASSWORD unset to skip seeding
# entirely, e.g. in an environment where admins are managed another way.
admin:
  seed:
    enabled: ${ADMIN_SEED_ENABLED:true}
    email: ${ADMIN_SEED_EMAIL:admin@example.com}
    password: ${ADMIN_SEED_PASSWORD:testpassword}
    first-name: ${ADMIN_SEED_FIRST_NAME:System}
    last-name: ${ADMIN_SEED_LAST_NAME:Admin}