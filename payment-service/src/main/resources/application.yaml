spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/payment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

app:
  kafka:
    payment-topic: payment-events
  # Shared secret that proves a request carrying X-User-* identity headers
  # actually came from api-gateway. Checked by UserContextFilter. Must
  # match api-gateway's app.internal-service-token exactly.
  internal-service-token: ${INTERNAL_SERVICE_TOKEN:test-only-7f3c9a2e81b64d0fa5c7e93b18d246a9}

# Stripe test-mode keys - get these from your own Stripe dashboard
# (dashboard.stripe.com/test/apikeys and .../webhooks). Both required;
# no default here since a placeholder secret key would fail every call
# with an auth error that's confusing to debug.
stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  # Base pages on the frontend that Stripe redirects the customer back to
  # after they finish (or abandon) the hosted Checkout page.
  success-url: ${STRIPE_SUCCESS_URL:https://9302-196-188-161-180.ngrok-free.app/payment/success}
  cancel-url: ${STRIPE_CANCEL_URL:https://9302-196-188-161-180.ngrok-free.app/payment/cancel}

server:
  port: 8086

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}