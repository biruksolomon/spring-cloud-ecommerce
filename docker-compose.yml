version: "3.8"

# Full local stack: MySQL + Kafka + all 7 microservices.
# Usage:
#   docker compose up --build        # first run / after code changes
#   docker compose up -d             # subsequent runs
#   docker compose down -v           # tear down + wipe volumes
#
# Service URLs from the host machine:
#   Eureka dashboard:  http://localhost:8761
#   API Gateway:        http://localhost:8080
#   Kafka UI:            http://localhost:8085

# Dev-only key material. Real, working values checked in so the stack
# runs out of the box - replace all three in any shared or production
# environment (see the comments on each service's application.yaml for
# what would need to change).
x-rsa-private-key: &rsa-private-key 
x-rsa-public-key: &rsa-public-key 
x-internal-service-token: &internal-service-token test-only-7f3c9a2e81b64d0fa5c7e93b18d246a9

networks:
  ecommerce-net:
    driver: bridge

volumes:
  mysql_data:

services:

  # ---------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ecommerce-net

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two listeners: PLAINTEXT for other containers on the docker network,
      # PLAINTEXT_HOST for tools running on the host machine.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - ecommerce-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - ecommerce-net

  # ---------------------------------------------------------------
  # Discovery
  # ---------------------------------------------------------------

  discovery-server:
    build: ./discovery-server
    container_name: discovery-server
    ports:
      - "8761:8761"
    networks:
      - ecommerce-net

  # ---------------------------------------------------------------
  # Gateway
  # ---------------------------------------------------------------

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    environment:
      EUREKA_URI: http://discovery-server:8761/eureka
      RSA_PUBLIC_KEY: *rsa-public-key
      INTERNAL_SERVICE_TOKEN: *internal-service-token
    ports:
      - "8080:8080"
    depends_on:
      - discovery-server
      - auth-service
    networks:
      - ecommerce-net

  # ---------------------------------------------------------------
  # Business services
  # ---------------------------------------------------------------

  auth-service:
    build: ./auth-service
    container_name: auth-service
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      EUREKA_URI: http://discovery-server:8761/eureka
      RSA_PRIVATE_KEY: *rsa-private-key
      RSA_PUBLIC_KEY: *rsa-public-key
      INTERNAL_SERVICE_TOKEN: *internal-service-token
      # OAuth2 Web client ID for "Sign in with Google" (POST /auth/google).
      # Must be set in the shell/.env before `docker-compose up` - see
      # GOOGLE_CLIENT_ID below. Left unset here on purpose otherwise:
      # GoogleTokenVerifier fails fast rather than trusting an unscoped
      # audience.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    ports:
      - "8084:8084"
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_started
    networks:
      - ecommerce-net

  product-service:
    build: ./product-service
    container_name: product-service
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      EUREKA_URI: http://discovery-server:8761/eureka
      INTERNAL_SERVICE_TOKEN: *internal-service-token
      # Cloudinary account for product image uploads - see .env.example.
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_started
    networks:
      - ecommerce-net

  order-service:
    build: ./order-service
    container_name: order-service
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      EUREKA_URI: http://discovery-server:8761/eureka
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      INTERNAL_SERVICE_TOKEN: *internal-service-token
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_started
    networks:
      - ecommerce-net

  payment-service:
    build: ./payment-service
    container_name: payment-service
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      EUREKA_URI: http://discovery-server:8761/eureka
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Test-mode keys from dashboard.stripe.com/test/apikeys and
      # dashboard.stripe.com/test/webhooks - set these in a .env file
      # alongside docker-compose.yml, do not commit real values.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      INTERNAL_SERVICE_TOKEN: *internal-service-token
    ports:
      - "8086:8086"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_started
    networks:
      - ecommerce-net

  notification-service:
    build: ./notification-service
    container_name: notification-service
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      EUREKA_URI: http://discovery-server:8761/eureka
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_started
    networks:
      - ecommerce-net